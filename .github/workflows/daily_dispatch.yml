name: Continuous Technical Wisdom Synchronization

on:
  schedule:
    # Testing mode: triggers every 15 minutes automatically
    - cron: '*/15 * * * *'
    # Production schedule (commented for testing):
    # - cron: '35 3 * * *'
  workflow_dispatch: # Allows manual override triggers via the GitHub Console Actions tab
    inputs:
      model:
        description: "Gemini Model to execute generation"
        required: false
        default: "gemini-3.8-flash"
        type: choice
        options:
          - "gemini-3.8-flash"
          - "gemini-3.0-flash"
          - "gemini-2.5-flash"

jobs:
  execute-architecture-generation:
    name: Generate & Sync Daily Architecture Blueprint
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python Runtime
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Daily Wisdom Generator via Gemini Pro
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_MODEL: ${{ inputs.model || 'gemini-3.8-flash' }}
      run: |
        chmod +x ./scripts/run_daily_wisdom.sh
        ./scripts/run_daily_wisdom.sh

    - name: Commit and Push Generated Blueprint to Repository
      run: |
        git config --global user.name "Amitkumar_Tiwari"
        git config --global user.email "69420529+Amit1092tiwari@users.noreply.github.com"
        git add dispatches/
        # Check for modifications to avoid throwing non-zero exit codes if nothing changed
        if ! git diff-index --quiet HEAD; then
          git commit -m "chore: auto-generated hyperscale architecture dispatch - $(date +'%Y-%m-%d %H:%M:%S UTC')"

          # Clean any stray unstaged working tree changes to guarantee clean rebase
          git checkout -- . 2>/dev/null || true

          # Resilient sync and push loop with exponential backoff for transient GitHub 500 errors
          max_attempts=5
          attempt=1
          success=0

          while [ $attempt -le $max_attempts ]; do
            echo "Sync attempt $attempt of $max_attempts: pulling latest changes from origin main..."
            if ! git pull --rebase origin main; then
              echo "Rebase conflict or lock on attempt $attempt. Aborting rebase and retrying in $((attempt * 3))s..."
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 3))
              attempt=$((attempt + 1))
              continue
            fi

            echo "Pushing commits to origin main (attempt $attempt)..."
            if git push origin main; then
              echo "Successfully pushed generated blueprint to origin main."
              success=1
              break
            else
              echo "Push failed on attempt $attempt (transient GitHub 500 error or lock). Retrying in $((attempt * 5))s..."
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            fi
          done

          if [ $success -ne 1 ]; then
            echo "ERROR: Failed to push blueprint to origin main after $max_attempts attempts." >&2
            exit 1
          fi
        else
          echo "No blueprint updates detected. Skipping push."
        fi
