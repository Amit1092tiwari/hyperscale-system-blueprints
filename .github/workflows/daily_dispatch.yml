name: Continuous Technical Wisdom Synchronization

on:
  schedule:
    # Triggers dynamically every single calendar day at 03:35 UTC / 09:05 AM IST
    # (Off-peak minute :35 avoids high platform queue delays and drops at :00 and :30)
    - cron: '35 3 * * *'
  workflow_dispatch: # Allows manual override triggers via the GitHub Console Actions tab
    inputs:
      model:
        description: "Gemini Model to execute generation"
        required: false
        default: "gemini-2.0-flash"
        type: choice
        options:
          - "gemini-2.0-flash"
          - "gemini-1.5-pro"
          - "gemini-1.5-flash"

jobs:
  execute-architecture-generation:
    name: Generate & Sync Daily Architecture Blueprint
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python Runtime
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Daily Wisdom Generator via Gemini Pro
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_MODEL: ${{ inputs.model || 'gemini-2.0-flash' }}
      run: |
        chmod +x ./scripts/run_daily_wisdom.sh
        ./scripts/run_daily_wisdom.sh

    - name: Commit and Push Generated Blueprint to Repository
      run: |
        git config --global user.name "Amitkumar_Tiwari"
        git config --global user.email "69420529+Amit1092tiwari@users.noreply.github.com"
        git add dispatches/
        # Check for modifications to avoid throwing non-zero exit codes if nothing changed
        if ! git diff-index --quiet HEAD; then
          git commit -m "chore: auto-generated hyperscale architecture dispatch - $(date +'%Y-%m-%d')"
          git pull --rebase origin main || true
          git push origin main
        else
          echo "No blueprint updates detected. Skipping push."
        fi
